# Checks the skill's commands and flags against the released CLI's own help
# (the hidden `docs generate` command). See scripts/cli-drift-check.py.
#
# CLI_VERSION is the CLI the skill documents, and pull requests check against
# it. Bump it when the skill moves to a new release: 3.x versions download
# `orka3`, 4.0 and later `orka`. The Monday run checks the latest released `orka`
# CLI instead (official/orka/latest.json, written by the CLI release workflow),
# so it fails when a new release changes commands or flags the skill uses.
# The Monday run is strict: a new CLI flag a command reference doesn't list fails
# it too, and a failure posts to Slack through the SLACK_WEBHOOK_DRIFT_CHECK secret.
name: CLI drift check

on:
  pull_request:
    paths:
      - "orka3-cli/**"
      - "scripts/cli-drift-check.py"
      - ".github/workflows/cli-drift-check.yml"
  schedule:
    - cron: "0 13 * * 1" # Mondays, against the latest CLI release
  workflow_dispatch:
    inputs:
      cli_version:
        description: "CLI version to check against (default: CLI_VERSION below)"
        required: false

env:
  CLI_VERSION: "4.0.0"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Read by the Notify Slack step's `if:`, which can't read secrets directly.
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_DRIFT_CHECK }}
    steps:
      - uses: actions/checkout@v7

      - name: Pick the CLI version
        env:
          INPUT_VERSION: ${{ inputs.cli_version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            version=$(curl -fsSL https://cli-builds-public.s3.amazonaws.com/official/orka/latest.json | jq -er .version)
          else
            version="$CLI_VERSION"
          fi
          echo "Checking against CLI $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Download the CLI
        run: |
          major="${VERSION%%.*}"
          if [ "$major" -ge 4 ]; then name=orka; else name=orka3; fi
          curl -fsSL "https://cli-builds-public.s3.amazonaws.com/official/${VERSION}/${name}/linux/amd64/${name}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/${name}" version --client
          echo "CLI_NAME=${name}" >> "$GITHUB_ENV"

      - name: Compare with the skill
        run: |
          # The Monday run also fails on warnings: a new CLI flag a command reference doesn't list.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then strict=--strict; else strict=; fi
          python3 scripts/cli-drift-check.py --cli "$RUNNER_TEMP/$CLI_NAME" --binary-name "$CLI_NAME" $strict

      - name: Notify Slack
        # cancelled() too: a timeout ends the job cancelled, not failed.
        if: (failure() || cancelled()) && github.event_name == 'schedule' && env.SLACK_WEBHOOK != ''
        # DRIFT_CHECK_SLACK_MENTION is a repo variable, for example <@SLACK_USER_ID>.
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ env.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ vars.DRIFT_CHECK_SLACK_MENTION }} :x: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Skill CLI drift check> failed against CLI ${{ env.VERSION }}: the orka3-cli skill is out of date with the latest release."
